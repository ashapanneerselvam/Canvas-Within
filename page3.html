<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Canvas Within</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Poppins',sans-serif;

background:
linear-gradient(rgba(250,247,242,.88),rgba(250,247,242,.88)),
url("image/download.png") center/cover fixed;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:30px;

}

.card{

background:white;

max-width:750px;

width:100%;

padding:40px;

border-radius:20px;

box-shadow:0 15px 35px rgba(0,0,0,.12);

}

h1{

font-family:'Playfair Display',serif;

text-align:center;

color:#5B2B20;

font-size:45px;

margin-bottom:10px;

}

.subtitle{

text-align:center;

font-size:16px;

color:#6b5a4d;

line-height:1.8;

margin-bottom:35px;

}

.field{

margin-bottom:20px;

}

label{

display:block;

margin-bottom:8px;

font-weight:600;

color:#5B2B20;

}

input,
select,
textarea{

width:100%;

padding:14px;

font-size:16px;

border:1px solid #d6c6b8;

border-radius:10px;

font-family:'Poppins',sans-serif;

transition:.3s;

}

input:focus,
select:focus,
textarea:focus{

outline:none;

border-color:#5B2B20;

box-shadow:0 0 10px rgba(91,43,32,.2);

}

textarea{

height:130px;

resize:vertical;

}

button{

width:100%;

padding:16px;

background:#5B2B20;

color:white;

border:none;

border-radius:40px;

font-size:18px;

cursor:pointer;

transition:.3s;

font-family:'Poppins',sans-serif;

}

button:hover{

background:#3d1d15;

transform:translateY(-3px);

}

button:disabled{

background:#999;

cursor:not-allowed;

}

footer{

text-align:center;

margin-top:30px;

font-size:14px;

color:#5B2B20;

}

</style>

</head>

<body>

<div class="card">

<h1>Customize Your Order</h1>

<p class="subtitle">

Share your ideas with me, and I'll create a handcrafted letter designed especially for your special occasion.

</p>

<form id="orderForm">

<div class="field">

<label>Full Name</label>

<input type="text" name="name" placeholder="Enter your full name" required>

</div>

<div class="field">

<label>Email Address</label>

<input type="email" name="email" placeholder="example@gmail.com" required>

</div>

<div class="field">

<label>Occasion</label>

<select id="occasion" name="ordertype" required>

<option value="">Select Occasion</option>

<option>Birthday</option>

<option>Anniversary</option>

<option>Friendship</option>

<option>Vintage Love Letter</option>

<option value="Other">Other</option>

</select>

</div>

<div class="field">

<label>Letter Type (Only for Other)</label>

<input type="text"
id="lettertype"
name="lettertype"
disabled
placeholder="Available only when Other is selected">

</div>

<div class="field">

<label>Special Quote / Message</label>

<textarea
name="message"
placeholder="Write your message here..."></textarea>

</div>

<div class="field">

<label>Preferred Colour</label>

<input type="text"
name="colour"
placeholder="Example: Brown, Beige, White">

</div>

<div class="field">

<label>Phone Number</label>

<input type="tel"
name="phone"
pattern="[0-9]{10}"
placeholder="Enter 10-digit phone number"
required>

</div>

<div class="field">

<label>Required Date</label>

<input type="date"
id="date"
name="date"
required>

</div>

<button id="submitBtn" type="submit">

Place Your Order

</button>

</form>

<footer>

Designed & Developed by <strong>Asha</strong><br>

Fullstack Developer • Handmade Letter Artist

</footer>

</div>

<script>

const today=new Date().toISOString().split("T")[0];
document.getElementById("date").min=today;

const occasion=document.getElementById("occasion");
const letterType=document.getElementById("lettertype");

occasion.addEventListener("change",function(){

if(this.value==="Other"){

letterType.disabled=false;
letterType.required=true;
letterType.placeholder="Enter custom letter type";

}else{

letterType.disabled=true;
letterType.required=false;
letterType.value="";
letterType.placeholder="Available only when Other is selected";

}

});

const scriptURL="https://script.google.com/macros/s/AKfycbxHdq0gFNEZH6SKCPGBTDTeokpPF0PEvGthAorE7pEP95ESyZCuVIyfxtRtwJJy5Lwi/exec";

const form=document.getElementById("orderForm");

const submitBtn=document.getElementById("submitBtn");

form.addEventListener("submit",function(e){

e.preventDefault();

submitBtn.disabled=true;
submitBtn.innerHTML="Submitting Order...";

const formData={

name:this.name.value,
email:this.email.value,
ordertype:this.ordertype.value,
lettertype:this.lettertype.value,
message:this.message.value,
colour:this.colour.value,
phone:this.phone.value,
date:this.date.value

};

fetch(scriptURL,{

method:"POST",
body:JSON.stringify(formData)

})

.then(res=>res.json())

.then(()=>{

alert("Thank you! Your order has been submitted successfully.");

window.location.href="page4.html";

})

.catch(()=>{

alert("Something went wrong. Please try again.");

})

.finally(()=>{

submitBtn.disabled=false;
submitBtn.innerHTML="Place Your Order";

});

});

</script>

</body>
</html>
