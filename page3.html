<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Custom Order</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;background:
linear-gradient(rgba(248,245,239,.78),rgba(248,245,239,.78)),
url('image/download.png') center/cover fixed;
min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.card{width:100%;max-width:700px;background:rgba(255,255,255,.9);padding:30px;border-radius:18px;box-shadow:0 15px 35px rgba(0,0,0,.18);backdrop-filter:blur(6px)}
h1{text-align:center;color:#4b1f16;font-style:italic}
.field{margin:16px 0}label{display:block;margin-bottom:7px;font-weight:bold;color:#4b1f16}
input,select,textarea{width:100%;padding:14px;border:1px solid #c8b9a8;border-radius:10px;font-size:16px}
textarea{height:120px}
button{width:100%;padding:15px;border:none;border-radius:10px;background:#4b1f16;color:#fff;font-size:18px;cursor:pointer}
button:hover{background:#6d3728}
</style></head><body>
<div class='card'><h1>Custom Order</h1>
<form id='orderForm'>
<div class='field'><label>Full Name</label><input required name='name'></div>
<div class='field'><label>Email</label><input type='email' required name='email'></div>
<div class='field'><label>Occasion</label>
<select id='occasion' name='ordertype' required>
<option value=''>Select Occasion</option>
<option>Birthday</option><option>Anniversary</option><option>Friendship</option><option>Vintage Love Letter</option><option value='Other'>Other</option>
</select></div>
<div class='field'><label>Letter Type (Only for Other)</label>
<input id='lettertype' name='lettertype' placeholder='Enter letter type' disabled></div>
<div class='field'><label>Special Quote / Message</label><textarea name='message'></textarea></div>
<div class='field'><label>Preferred Colour</label><input name='colour'></div>
<div class='field'><label>Phone Number</label><input type='tel' required name='phone'></div>
<div class='field'><label>Required Date</label><input id='date' type='date' required name='date'></div>
<button>Place Your Order</button></form></div>
<script>
date.min=new Date().toISOString().split('T')[0];
occasion.onchange=()=>{
 const lt=document.getElementById('lettertype');
 if(occasion.value==='Other'){lt.disabled=false;lt.required=true;lt.placeholder='Enter custom letter type';}
 else{lt.disabled=true;lt.required=false;lt.value='';lt.placeholder='Available only when Other is selected';}
};
const scriptURL="https://script.google.com/macros/s/AKfycbyNTF-glMg-5V8qvJ7VWFRJrjAFQ8f_vT2vqYG33rqVrYA4EgR7b7MZYRanrXRkXV8Fog/exec";
orderForm.onsubmit=async(e)=>{e.preventDefault();const b=document.querySelector('button');b.disabled=true;b.textContent='Submitting...';
try{await fetch(scriptURL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(orderForm).entries()))});
alert('Order Submitted Successfully');location.href='page4.html';}catch(e){alert('Error');}b.disabled=false;b.textContent='Place Your Order';}
</script></body></html>
