<script>
const dateInput = document.getElementById("date");
dateInput.min = new Date().toISOString().split("T")[0];

const occasion = document.getElementById("occasion");
const letterType = document.getElementById("lettertype");

occasion.addEventListener("change", function () {

    if (this.value === "Other") {
        letterType.disabled = false;
        letterType.required = true;
        letterType.placeholder = "Enter custom letter type";
    } else {
        letterType.disabled = true;
        letterType.required = false;
        letterType.value = "";
        letterType.placeholder = "Available only when Other is selected";
    }

});

const scriptURL =
"https://script.google.com/macros/s/AKfycbxHdq0gFNEZH6SKCPGBTDTeokpPF0PEvGthAorE7pEP95ESyZCuVIyfxtRtwJJy5Lwi/exec";

const form = document.getElementById("orderForm");

form.addEventListener("submit", async function (e) {

    e.preventDefault();

    const button = this.querySelector("button");

    button.disabled = true;
    button.textContent = "Submitting...";

    const formData = Object.fromEntries(new FormData(form).entries());

    try {

        const response = await fetch(scriptURL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(formData)
        });

        const text = await response.text();

        console.log("Response:", text);

        let result;

        try {
            result = JSON.parse(text);
        } catch {
            throw new Error("Invalid response from Apps Script");
        }

        if (result.status === "success") {

            alert("Order Submitted Successfully!");

            form.reset();

            window.location.href = "page4.html";

        } else {

            alert(result.message || "Submission Failed");

        }

    } catch (err) {

        console.error(err);

        alert("Network / Server Error\n\n" + err.message);

    }

    button.disabled = false;
    button.textContent = "Place Your Order";

});
</script>
